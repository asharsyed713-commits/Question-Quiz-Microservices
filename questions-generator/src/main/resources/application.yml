
spring:
  application:
    name: questions-generator
  #Rabbit Mq configurations
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  #Spring AI configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  data:
    mongodb:
      uri: mongodb://localhost:27017/questionsdb

  config:
    import: "configserver:http://localhost:9094"

  profiles:
    active: qa



#Streaming configuration
  cloud:
    function:
      definition: getQuizBinding


    stream:
      bindings:
        getQuizBinding-in-0:
            destination: quiz-created
            group: ${spring.application.name}


        getQuizBinding-out-0:
            destination: acknowledge-quiz



server:
  port: 9097

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    refresh:
      enable: false





#Resilience4j configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        waitDurationInHalfOpenState: 5000


