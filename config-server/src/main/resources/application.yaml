#Config server configuration for github
  cloud:
    config:
      server:
        git:
          uri: https://github.com/asharsyed713-commits/micro-config
          default-label: main
          clone-on-start: true
server:
  port: 9094

#Eureka configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

#Rabbit Mq configurations
rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest

