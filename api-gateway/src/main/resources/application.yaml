spring:
  application:
    name: api-gateway

  cloud:
    gateway:
     server:
       webflux:
         discovery:
           locator:
             enabled: true

 #Rate limiting configuration
  data:
    redis:
      host: localhost
      port: 6379


  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9096/realms/dev/protocol/openid-connect/certs
server:
  port: 9093

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


#Actuator configuration
#/actuator/gateway/routes to access the routes
management:
    endpoints:
      web:
        exposure:
          include: "*"

#    info:
#      env:
#        enabled: true

    endpoint:
     gateway:
      access: READ_ONLY

#Resilience4j configuration
resilience4j:
    circuitbreaker:
      configs:
        default:
          slidingWindowSize: 10
          permittedNumberOfCallsInHalfOpenState: 2
          failureRateThreshold: 50
          waitDurationInOpenState: 10000

      instances:
        categoryCircuitBreaker:
          baseConfig: default