spring:
  application:
    name: category-service

  profiles:
    active: dev
  #Config server configuration
  config:
    import: configserver:http://localhost:9094

  datasource:
    url: jdbc:postgresql://localhost:5432/categorydb
    username: user
    password: user123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 9091


eureka:
  instance:
    prefer-ip-address: true
    ip-address: 192.168.29.185
  client:
      service-url:
          defaultZone: http://localhost:8761/eureka/
      refresh:
        enable: false

#Rabbit Mq configurations
rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


